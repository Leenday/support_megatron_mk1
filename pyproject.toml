[project]
name = "megatron"
version = "0.1.0"
description = "Megatron-mk1: free-text support request -> validated JSON ticket routed to a department"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.1.3",
    "django-ninja>=1.8.0",
    "ollama>=0.6",
    "openai>=3.41",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "pyyaml>=6.0",
    "scikit-learn>=1.7",
]

[project.scripts]
megatron = "megatron.__main__:main"
megatron-testset = "megatron.testset_cli:main"
megatron-eval = "megatron.eval_cli:main"

[dependency-groups]
dev = [
    "deptry==0.25.1",
    "django-stubs>=6.1.2",
    "pre-commit>=4.3",
    "pytest>=8.4",
    "pytest-django>=4.14.0",
    "ruff>=0.17",
    "ty==0.0.92",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]
pythonpath = ["web"]
DJANGO_SETTINGS_MODULE = "megatron_web.settings_test"

[tool.deptry]
# src layout and the Django project in web/: deptry cannot infer them
known_first_party = ["megatron", "megatron_web", "support"]
extend_exclude = ["e2e"]  # e2e/ runs with `uvx --with playwright`, not a dependency

[tool.deptry.per_rule_ignores]
DEP002 = ["psycopg"]  # the PostgreSQL driver, loaded by Django rather than imported

[tool.ty.environment]
extra-paths = ["web"]

[tool.ty.src]
exclude = ["e2e"]  # needs playwright, which is not a project dependency (uvx --with playwright)

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "T20", # no print() outside the CLI
]

[tool.ruff.lint.isort]
known-first-party = ["megatron", "megatron_web", "support"]  # web/ is not on ruff's src path

[tool.ruff.lint.per-file-ignores]
"src/megatron/__main__.py" = ["T20"]
"src/megatron/testset_cli.py" = ["T20"]
"src/megatron/eval_cli.py" = ["T20"]
"e2e/*" = ["T20"]
"web/*/migrations/*" = ["E501"]  # generated by makemigrations
