default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: no-commit-to-branch
        args: [--branch, main, --branch, develop]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: no-ai-attribution
        name: commit message has no AI attribution
        language: pygrep
        entry: '(?i)(co-authored-by:.*(claude|anthropic)|generated with \[?claude)'
        stages: [commit-msg]

      # Conventional Commits 1.0.0 with the types from the git-workflow skill.
      - id: conventional-commit
        name: "commit message is a Conventional Commit: <type>(<scope>): <summary>"
        language: pygrep
        entry: '\A(?:(?:fixup|squash|amend)! )*(?:feat|fix|docs|test|refactor|build|ci|chore)(?:\([a-z0-9-]+\))?!?: \S'
        args: [--multiline, --negate]
        stages: [commit-msg]

      - id: ty
        name: ty check
        language: system
        entry: uv run --locked ty check
        types: [python]
        pass_filenames: false

      - id: deptry
        name: deptry
        language: system
        entry: uv run --locked deptry .
        files: (\.py|pyproject\.toml|uv\.lock)$
        pass_filenames: false

      # data/local/ is git-ignored; this also stops `git add -f`.
      - id: no-local-data
        name: nothing from data/local/ is committed
        language: fail
        entry: "data/local/ holds real requests and datasets and must stay on this machine"
        files: ^data/local/
