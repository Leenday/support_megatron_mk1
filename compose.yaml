# Iteration 1: Ollama + CLI + tests. Iteration 2 adds `web` (Django) and `db` (Postgres).
#
#   docker compose up -d ollama               # start the model server (first run pulls the model)
#   docker compose run --rm megatron "text"   # CLI
#   docker compose run --rm tests             # pytest
#
# Ollama runs on CPU inside Docker on macOS (no Metal GPU in Docker's Linux VM).
# NVIDIA hosts: add the GPU override, docker compose -f compose.yaml -f compose.gpu.yaml up -d ollama.
# To use a native Ollama on the host instead, set OLLAMA_BASE_URL_DOCKER=http://host.docker.internal:11434.

x-app-env: &app-env
  LLM_BACKEND: ${LLM_BACKEND:-ollama}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL_DOCKER:-http://ollama:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
  GIGACHAT_CREDENTIALS: ${GIGACHAT_CREDENTIALS:-}
  DEPARTMENTS_PATH: config/departments.yaml

services:
  ollama:
    image: ollama/ollama:0.40.7
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot: downloads the model into the shared volume (a no-op once it is there).
  ollama-pull:
    image: ollama/ollama:0.40.7
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-qwen3:8b}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

  megatron:
    build:
      context: .
      target: runtime
    environment: *app-env
    volumes:
      - ./config:/app/config:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles: [cli]

  tests:
    build:
      context: .
      target: dev
    entrypoint: ["pytest"]
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./config:/app/config:ro
    profiles: [cli]

volumes:
  ollama:
