# Iteration 1: CLI + tests. Iteration 2 adds `web` (Django) and `db` (Postgres).
#
# Ollama runs natively on the Mac host: Docker on macOS has no Metal GPU, so
# Ollama inside a container is CPU-only. Containers reach the host through
# host.docker.internal. Without native Ollama, start the CPU fallback with
#   docker compose --profile ollama-cpu up -d ollama
# and set OLLAMA_BASE_URL=http://ollama:11434 in .env.

x-app-env: &app-env
  LLM_BACKEND: ${LLM_BACKEND:-ollama}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL_DOCKER:-http://host.docker.internal:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
  GIGACHAT_CREDENTIALS: ${GIGACHAT_CREDENTIALS:-}
  DEPARTMENTS_PATH: config/departments.yaml

services:
  megatron:
    build:
      context: .
      target: runtime
    environment: *app-env
    volumes:
      - ./config:/app/config:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  tests:
    build:
      context: .
      target: dev
    entrypoint: ["pytest"]
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./config:/app/config:ro

  ollama:
    image: ollama/ollama:latest
    profiles: [ollama-cpu]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  ollama:
