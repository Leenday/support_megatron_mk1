# Support departments (any routing target: a department, queue, support line or category).
# Another domain or dataset gets its own file, selected with DEPARTMENTS_PATH.
#
# The ticket's `candidates` may only take ids from this list (a JSON-schema enum for the LLM).
# The model picks them by `description`, which is in the prompt, so descriptions and tags
# are in English for all departments.
#
# name_ru, name_en — display names for people (UI, reports)
#
# languages     — ticket languages (ISO 639-1); the first is used for requests in other languages
# capacity      — optional: how many open tickets the department can handle at once
# open_tickets  — optional: mock current load for iteration 1; in iteration 2 it comes from
#                 the database. Give both for all departments, or leave them out everywhere.
# language      — language the department's tickets are written in (one of `languages`)
# fallback      — exactly one department receives requests that fit nowhere else

languages: [ru, en]

# Routing: score = w_match * match + w_load * (1 - load) over the model's candidate
# departments (best fit first); match of the 1st, 2nd, 3rd candidate is rank_match. Without
# load the best fit wins. A department the model did not list never gets the ticket.
routing:
  w_match: 0.7  # weight of the profile match
  w_load: 0.3   # weight of free capacity, (1 - load)
  rank_match: [1.0, 0.6, 0.3]

departments:
  - id: hardware
    name_ru: Оборудование и рабочие места
    name_en: Hardware and workplaces
    description: >-
      Computers, laptops, monitors, printers, scanners, phones and other office equipment:
      breakdowns, replacement, setting up a new workplace, peripherals that do not work.
    tags: [hardware, computer, laptop, printer, monitor, peripherals, workplace]
    language: ru
    capacity: 10
    open_tickets: 4

  - id: network
    name_ru: Сеть и связь
    name_en: Network and communications
    description: >-
      Internet and local network access, Wi-Fi, VPN, slow or dropped connections,
      network drives, IP telephony.
    tags: [network, internet, wifi, vpn, connection, telephony]
    language: ru
    capacity: 8
    open_tickets: 5

  - id: software
    name_ru: ПО и учётные записи
    name_en: Software and accounts
    description: >-
      Installing and updating software, application errors, licences, e-mail and office
      suite problems, user accounts, passwords, access rights to systems and folders.
    tags: [software, application, email, account, password, access, license]
    language: en
    capacity: 12
    open_tickets: 3

  - id: security
    name_ru: Информационная безопасность
    name_en: Information security
    description: >-
      Suspicious e-mails and phishing, viruses and malware, lost or stolen devices,
      suspected data leaks or unauthorised access.
    tags: [security, phishing, virus, malware, leak, incident]
    language: ru
    capacity: 5
    open_tickets: 1

  - id: general
    name_ru: Общая поддержка
    name_en: General support
    description: >-
      Requests that are unclear, too short to classify, or do not fit any other department.
      A specialist clarifies the request and forwards it.
    tags: [general, unclear, other]
    language: ru
    capacity: 10
    open_tickets: 2
    fallback: true
