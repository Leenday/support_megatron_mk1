# Support departments. The ticket's `department` field may only take an `id` from this list
# (it becomes a JSON-schema enum for the LLM). `description` and `tags` go into the prompt
# and the profile-match part of routing.
#
# capacity      — how many open tickets the department can handle at once
# open_tickets  — mock current load for iteration 1; in iteration 2 it comes from the database
# language      — language the department's tickets are written in (ru | en)
# fallback      — exactly one department receives requests that fit nowhere else

routing:
  w_match: 0.7  # weight of the profile match
  w_load: 0.3   # weight of free capacity, (1 - load)

departments:
  - id: hardware
    name: Оборудование и рабочие места
    description: >-
      Computers, laptops, monitors, printers, scanners, phones and other office equipment:
      breakdowns, replacement, setting up a new workplace, peripherals that do not work.
    tags: [hardware, computer, laptop, printer, monitor, peripherals, workplace]
    language: ru
    capacity: 10
    open_tickets: 4

  - id: network
    name: Сеть и связь
    description: >-
      Internet and local network access, Wi-Fi, VPN, slow or dropped connections,
      network drives, IP telephony.
    tags: [network, internet, wifi, vpn, connection, telephony]
    language: ru
    capacity: 8
    open_tickets: 5

  - id: software
    name: Software and accounts
    description: >-
      Installing and updating software, application errors, licences, e-mail and office
      suite problems, user accounts, passwords, access rights to systems and folders.
    tags: [software, application, email, account, password, access, license]
    language: en
    capacity: 12
    open_tickets: 3

  - id: security
    name: Информационная безопасность
    description: >-
      Suspicious e-mails and phishing, viruses and malware, lost or stolen devices,
      suspected data leaks or unauthorised access.
    tags: [security, phishing, virus, malware, leak, incident]
    language: ru
    capacity: 5
    open_tickets: 1

  - id: general
    name: Общая поддержка
    description: >-
      Requests that are unclear, too short to classify, or do not fit any other department.
      A specialist clarifies the request and forwards it.
    tags: [general, unclear, other]
    language: ru
    capacity: 10
    open_tickets: 2
    fallback: true
